name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: |
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk LikeFlow.apk

      - uses: actions/upload-artifact@v4
        with:
          name: likeflow-debug-apk
          path: LikeFlow.apk
          if-no-files-found: error

      # A fixed pre-release whose APK is replaced on every push, so the phone download link never changes.
      - name: Publish APK to the "latest" release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: LikeFlow (latest build)
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          files: LikeFlow.apk
          body: |
            Latest LikeFlow debug build from `${{ github.ref_name }}` (${{ github.sha }}).
            Download **LikeFlow.apk** on your Android phone and open it to install.
